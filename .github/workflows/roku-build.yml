# Roku channel (apps/roku): lint with BrighterScript, run the pure-logic tests, build the
# sideloadable zip. Only runs when the channel changes. No secrets, read-only token.
# This does NOT run the channel on a Roku: there is no Roku in CI (see apps/roku/README.md).
name: Roku channel

on:
  push:
    branches: [main]
    paths: ["apps/roku/**", ".github/workflows/roku-build.yml"]
  pull_request:
    paths: ["apps/roku/**", ".github/workflows/roku-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roku-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  roku:
    name: Lint, test, package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/roku
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/roku/package-lock.json
      - run: npm ci
      - name: npm audit (informational, does not fail CI yet)
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beebo-roku-sideload-zip
          path: apps/roku/out/beebo-roku.zip
          if-no-files-found: error
