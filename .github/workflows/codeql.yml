# CodeQL code scanning (JavaScript/TypeScript and Java/Kotlin). Free on public repositories.
# Results appear in the Security tab. Least-privilege token: only the analyze job may write
# security events. In Settings > Code security, leave "CodeQL analysis" default setup OFF so
# this workflow is the one that runs.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # workflow run info for the CodeQL action
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          # Interpreted language: no build needed.
          - language: javascript-typescript
            build-mode: none
          # Java/Kotlin can be analysed without a build (no Android SDK needed).
          - language: java-kotlin
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
