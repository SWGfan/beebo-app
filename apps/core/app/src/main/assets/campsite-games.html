const RULES = {"connect4":{"players":"2 players","goal":"You win by getting four of your counters in a line - across, down or diagonally.","steps":["Take turns with the other player.","Tap a column to drop one of your counters into it.","Your counter falls to the lowest empty space in that column.","A column that is already full cannot take another counter, so pick a different one.","The first person to make a line of four wins."],"note":"If the whole board fills up and nobody has four in a line, it is a draw."},"ttt":{"players":"2 players","goal":"You win by getting three of your marks in a line - across, down or diagonally.","steps":["Take turns with the other player.","Tap any empty square to put your mark in it.","You can only use a square that is still empty.","The first person to make a line of three wins."],"note":"If all nine squares are filled and nobody has a line, it is a draw."},"checkers":{"players":"2 players","goal":"You win by taking all your opponent's pieces, or by leaving them with no move they can make.","steps":["Tap one of your pieces, then tap the dark square you want it to go to.","Pieces move one square diagonally, and only forwards.","Hop over a piece next to yours to take it - if a jump is there, you have to take it.","If the same piece can jump again, keep jumping with it before your turn ends.","Reach the far row and your piece becomes a king, which can move backwards too."],"note":"A king still moves only one square at a time, and being crowned ends your turn even if another jump was waiting."},"reversi":{"players":"2 players","goal":"You win by having more pieces of your colour on the board when nobody can move any more.","steps":["Four pieces start in the middle of the board.","Tap an empty square so that a line of your opponent's pieces is trapped between your new piece and one you already have.","Every trapped piece turns your colour.","You can only play somewhere that turns at least one piece over.","When neither of you can go, the pieces are counted and the most wins."],"note":"If you have no legal square, your turn is skipped for you - there is no Pass button to look for."},"morris":{"players":"2 players","goal":"You win by getting your opponent down to two pieces, or by leaving them with no move.","steps":["Take turns tapping an empty point to put a piece down, until you have both placed all nine.","After that, tap one of your pieces and slide it to an empty point next to it.","Line up three of your pieces along a line and you take one of your opponent's pieces off the board.","You can break a line and make it again later to take another piece.","Once you are down to three pieces, you can jump to any empty point instead of sliding."],"note":"You cannot take a piece that is sitting in a line of three, unless every piece they have left is in one."},"seabattle":{"players":"2 players","goal":"Sink all five enemy ships before your opponent sinks yours.","steps":["Drag each ship from the dock onto your sea, or select it and tap a starting square.","Select a ship and use Rotate ship to turn it. Drag a placed ship to move it, or return it to the dock.","Ships must stay inside the grid and cannot overlap. Shuffle fleet places them all for you; Clear sea lets you start again.","Place all five ships, then tap Ready — launch fleet. Both captains must be ready before shooting starts.","Take turns tapping an unknown square on the enemy sea. A ring is a miss, a cross is a hit.","A sunken enemy ship is revealed. Sink all five to win."],"note":"Your fleet stays private and locks when you tap Ready. You get one shot per turn, even after a hit."},"dominoes":{"players":"2 to 4","goal":"You win by playing all your dominoes first, or by holding the fewest spots when nobody can go.","steps":["Whoever was dealt the biggest double starts, and may open with any domino they like.","Tap one of your dominoes to add it to one end of the line.","The number on your domino has to match the number on the end you put it against.","If nothing in your hand matches, take from the boneyard and keep taking until you can play.","Play your last domino to win, and score all the spots left in everybody else's hands."],"note":"There is no Pass button - if you are stuck and the boneyard is empty your turn is skipped. If everybody else is stuck and you can still go, you go again."},"snakesladders":{"players":"2 to 6","goal":"You win by being the first to reach square 100.","steps":["Take turns tapping Roll.","Your token moves along the board by whatever the dice shows.","Land at the foot of a ladder and you climb up it.","Land on a snake and you slide down it.","Roll a six and you go again, up to three rolls in one turn."],"note":"You do not need an exact roll to finish - reaching or going past 100 wins."},"ludo":{"players":"2 to 4","goal":"You win by getting all four of your tokens all the way round and home.","steps":["Tap Roll when it is your turn.","You need a six to bring a token out of your yard.","Tap the token you want to move, and it travels the number you rolled.","Land on an opponent's token and it goes all the way back to their yard.","Roll a six and you roll again - but three sixes in a row and your turn is over.","Get all four tokens home to win."],"note":"A token needs the exact number to reach home, and the squares tokens come out on are safe from being sent back."},"trivia":{"players":"2 or more","goal":"You win by getting the most of the five questions right.","steps":["Read the question, which is made from the movies on your own host's computer.","Tap the answer you think is right.","When everyone has answered, the right answer is shown.","The leader taps Next to move on.","After five questions, whoever got the most right wins."],"note":"You can change your answer right up until the last person answers."},"thisorthat":{"players":"2 or more","goal":"Nobody wins this one - you are just finding out how the room splits.","steps":["Read the two choices.","Tap the one you like better.","Nobody can see what you picked until everyone has picked.","When the last person taps, all the votes are shown.","The leader taps Next to end the round."],"note":"You can change your mind until the last person votes."},"wouldyourather":{"players":"2 or more","goal":"Nobody wins - it is a vote, and the argument afterwards is the point.","steps":["Read the two impossible choices.","Tap the one you would rather have.","Nobody can see your pick until everyone has picked.","When the last person taps, all the votes are shown.","The leader taps Next to end the round."],"note":"You can change your mind until the last person votes."},"rps":{"players":"2 players","goal":"You win by taking three rounds first, out of five.","steps":["Tap Rock, Paper or Scissors without letting the other player see.","Nothing is shown until you have both chosen.","Both hands appear together, and the round is scored.","Rock beats Scissors, Scissors beats Paper, Paper beats Rock.","The leader taps Next, and you play again until somebody has three rounds."],"note":"If you both pick the same thing, the round does not count and you play it again."},"ispy":{"players":"2 or more","goal":"You win by being the first to tap once you have spotted the thing on the screen.","steps":["Read the thing everybody is looking for.","Look around you for it.","Tap to claim it the moment you spot it.","The first tap to reach the host takes the round."],"note":"Nothing checks that you really saw it, so play honestly."},"bingo":{"players":"2 or more","goal":"You win by marking a whole line on your card - across, down or corner to corner.","steps":["Look at your own card of things to spot; everybody's card is different.","The middle square is already marked for you.","Watch out of the window for something on your card.","Tap that square to mark it.","The first person to mark a full line wins."],"note":"A marked square stays marked, so an accidental second tap on a bumpy road cannot undo it."},"gofish":{"players":"2 to 6","goal":"You win by collecting the most sets of four.","steps":["Look at your hand - only you can see it.","On your turn, pick another player and pick a number to ask them for.","You can only ask for a number you are already holding.","If they have any, you take them all and go again.","If they have none, you take a card from the deck - and if it is the one you asked for, you go again.","Four of a kind goes face up on the table as a set."],"note":"The round ends when all thirteen sets are down, and the most sets wins - not the most cards."},"crazy8s":{"players":"2 to 6","goal":"You win by being the first to get rid of all your cards.","steps":["You get a hand only you can see, and one card is turned up to start the pile.","On your turn, play a card that matches either the suit or the number on top.","An eight can go on anything, and you choose which suit comes next.","If nothing in your hand can go, tap Draw and take one card.","Play your last card to win."],"note":"You can only draw when you have nothing to play. If the card you draw can go, you play it; if not, the turn moves on."},"oldmaid":{"players":"2 to 6","goal":"You win by being the first to get rid of all your cards - the one left holding the odd queen is the loser.","steps":["All the cards are dealt out, with one queen taken out of the deck first.","Any two cards of the same number in your hand go face up straight away.","On your turn, tap one of your neighbour's face-down cards to take it.","If it makes a pair with a card in your hand, both of them go face up.","The person you took from goes next.","First out wins. Whoever is left holding the last queen loses."],"note":"Your neighbour's cards are shuffled just before you pick, so where you tap tells you nothing."},"snap":{"players":"2 to 6","goal":"You win by ending up with all the cards.","steps":["Take turns tapping to turn the top card of your pile face up into the middle.","Watch the top two cards of the middle pile.","The moment the two cards are the same number, tap Snap.","The quickest tap takes the whole middle pile. Nobody can turn another card while a snap is sitting there.","If you have no cards left when somebody else takes the pile, you are out."],"note":"Tapping Snap when the cards do not match costs you a card - unless a real snap has just gone, in which case you were simply too slow. Two taps at almost the same moment are a tie, drawn at random."},"war":{"players":"2 players","goal":"You win by taking all the cards.","steps":["The deck is split between the two of you, face down.","You both tap to turn your top card over.","The higher card takes both cards.","If the two cards are the same, it is war: you each bury three cards face down and turn again.","Whoever wins the war takes everything on the table.","Take all the cards to win."],"note":"Aces are the highest card, and this game never counts towards the leaderboard because nobody makes a choice."},"pairs":{"players":"2 to 6","goal":"You win by collecting the most pairs.","steps":["Twenty-four cards start face down on the table.","On your turn, tap one card to turn it over, then tap a second one.","If the two cards are the same number, you keep them and have another go.","If they are not, they stay face up until the next player's first tap turns them back.","When every card has been taken, the most pairs wins."],"note":"Only the numbers have to match, so a red card and a black card pair up fine."},"twentyquestions":{"players":"2 or more","goal":"You win by guessing the secret; the leader wins if the secret survives all twenty questions.","steps":["The leader types a secret before the round starts, and only they can see it.","Everybody else types a question the leader can answer yes or no.","The leader taps Yes, No or Sometimes.","When you think you know, type your guess as a question.","If the leader taps Correct guess, you win the round."],"note":"Only one question can wait for an answer at a time, so if somebody gets in first, wait for the leader before sending yours."},"storybuilder":{"players":"2 or more","goal":"Nobody wins - the story is the whole point.","steps":["The story starts with 'Once upon a camping trip…'.","Wait for your turn, then type one line to add.","Your line goes on the end for everybody to read.","Turns go round and round until the leader taps Finish and reads it out."],"note":"Only the leader can finish the round, and a story can hold sixty lines."},"categorychains":{"players":"2 or more","goal":"Name the most things in the category - just for fun, nobody is checking.","steps":["Read the category at the top of the screen.","Wait for your turn, then type something that fits it.","Every word that is accepted scores you a point.","You cannot use a word that somebody has already said.","The leader taps Finish, and the most words wins."],"note":"Nobody on the host phone can tell a real word from a made-up one, so this round never counts towards the leaderboard or a tournament."},"quiet":{"players":"2 or more","goal":"You win by being the last person who has not made a sound.","steps":["Everybody stops talking.","If you make a sound, tap 'I'm out'.","Everyone can see how many people are still quiet.","The last player who has not tapped wins."],"note":"Nothing is listening to the room, so it is up to you to be honest and tap."},"spy":{"players":"3 to 10 players, each on their own phone","goal":"Find the spy - or, if you are the spy, work out where everyone is without getting caught.","steps":["Every phone shows the same place and a part to play there - except one, which says You're the spy.","Take turns asking each other questions out loud about the place, like 'What do you wear here?'.","Answer so the others can tell you know the place, without making it easy for the spy.","Anyone can call one vote per round on the player they suspect. Everyone else votes yes or no.","If most of the others vote yes and they caught the spy, everyone else wins. If they accused the wrong person, the spy wins.","The spy can guess the place from the list at any time: right and the spy wins, wrong and everyone else wins."],"note":"If the clock runs out before the spy is caught, the spy wins. The clock pauses while a vote is open."},"werewolf":{"players":"5 to 12 players, each on their own phone","goal":"Villagers win by voting out every werewolf. Werewolves win when there are as many of them as everyone else.","steps":["Everyone gets a secret card: werewolf, seer, healer or villager. Werewolves also see who the other werewolves are.","At night, everyone looks at their own phone. Werewolves choose a camper, the seer checks one player, the healer protects one player, and villagers pick who they suspect.","In the morning, the host phone tells everyone what happened. If the healer protected the right person, nobody leaves.","During the day, talk it over and vote. The player with the most votes leaves the game.","Players who are out can keep watching, but should stay quiet.","Night and day repeat until one side wins."],"note":"A tie, or more skips than votes for anyone, means nobody leaves that day. The host phone reads the story aloud; the leader can turn narration off."},"sketch":{"players":"3 to 8 players, each on their own phone","goal":"Score the most points by guessing drawings quickly - and by drawing well enough that others guess yours.","steps":["Players take turns to draw. The drawer's phone shows a secret word.","Draw it with your finger. Pick colours and brush sizes, and use Undo or Clear if it goes wrong. No letters or numbers!","Everyone else watches the drawing appear on their own phone and types guesses.","Capital letters, spaces and plurals don't matter. A guess that contains the answer is only shown to you.","The faster you guess, the more points you get. The drawer gets points for every player who guesses it.","When everyone has guessed or time runs out, the word is shown and the next player draws."],"note":"Before you start drawing you can swap your word once, or pass your turn. This game needs a touch screen, so it isn't offered on TV."},"fakeout":{"players":"3 to 8 players, each on their own phone","goal":"Score the most points by spotting true answers and fooling everyone with your fakes.","steps":["Read the strange but true fact. The answer is missing.","Write a fake answer that sounds believable. Nobody sees it yet.","If your fake is the real answer, or too close to it, you'll be asked to write something else.","All the fakes and the real answer are shown in a shuffled list.","Vote for the one you think is true. You can't vote for your own fake.","Find the truth for 2 points. Get 1 point for every player your fake fooled."],"note":"If only one or two fakes come in, the game adds a believable decoy of its own."},"picknext":{"players":"2 or more","goal":"You cannot really win - one suggestion is drawn at random and that is what the room does next.","steps":["Type one thing to watch or do.","Everybody's suggestions appear for the room to read.","Wait until everybody has put something in.","The leader taps to spin, and one suggestion is drawn.","Whatever comes out is the pick."],"note":"You get one suggestion each - typing again just replaces the one you put in."}};

const SUITS = [['S','♠','Spades',false],['H','♥','Hearts',true],['D','♦','Diamonds',true],['C','♣','Clubs',false]];

function el(tag, text, cls) { const n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; }
// SVG needs its own namespace. Text still goes in with textContent, never markup:
// a guest's name is drawn in the bracket lines and the chart just like anywhere else.
function svgel(tag, attrs, text) { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; return n; }
function button(text, action, disabled = false, cls = '') { const b = el('button',text,cls); b.type='button'; b.disabled=disabled || busy || !online; b.onclick=action; return b; }
function row(parent, ...kids){ const d = el('div',null,'actions'); kids.forEach(k=>k&&d.append(k)); parent.append(d); return d; }
// A local pick (a piece, a card, a rank) changes nothing on the host, so it has to
// force the redraw itself - the poll's fingerprint would not notice it.
function pick(value){ sel = value; render(true); }

function send(action, fields = {}) {
  if (busy) return;
  sel = null;
  pending = { action, ...fields, round:state?.room?.round ?? 0, actionId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2) };
  return perform();
}
async function perform() {
  const visualRoll=pending?.action==='roll'&&ART_DICE_GAMES.has(state?.room?.game);
  if(visualRoll)artDiceBegin(pending.actionId,state.room);
  actionEpoch++; busy = true; error.hidden=true;
  try {
    const response = await fetch('/api/games', {method:'POST',headers:{'Content-Type':'application/json','X-Beebo-Game':'1'},body:JSON.stringify(pending),cache:'no-store',signal:AbortSignal.timeout(8000)});
    const data = await response.json();
    if(response.status===401){ location.href='/games'; return; }
    if(!response.ok){ pending=null; throw new Error(data.error||'That action could not be completed.'); }
    const completedAction=pending.action;
    if(['text','start','enter','leave','guess','fake'].includes(completedAction)){const input=document.getElementById('entry');if(input)input.value='';}
    pending=null; online=true; state=data;
    if(visualRoll)artDiceResult(data.room,true);
    render(true);
  } catch(e) {
    if(visualRoll)artDiceCancel();
    error.replaceChildren(el('span',e.message||'Connection interrupted.'));
    if(pending){const retry=el('button','Retry same action');retry.type='button';retry.onclick=perform;error.append(retry);}
    error.hidden=false;
  } finally { busy=false; render(true); }
}
/**
 * A move the ROOM needs but the player did not ask for.
 *
 * Snap is the reason this exists. The engine has no timer of its own, so a judging
 * window is only ever closed by the next move to arrive; if every phone in the car
 * just sat there polling, the pile would never be awarded. The page therefore posts
 * a no-argument "resolve" on each poll while the snapshot says a snap is being
 * judged. It deliberately does NOT go through send(): it must not set `busy` (that
 * would grey out the Snap button at the exact moment somebody is trying to tap it),
 * must not clear a half-made selection, and must never raise an error banner - if it
 * fails, the next poll is a fraction of a second away.
 */
async function nudge(action) {
  if (resolving || busy) return;
  resolving = true;
  try {
    const body = { action, round: state?.room?.round ?? 0, actionId: Date.now().toString(36)+'-'+Math.random().toString(36).slice(2) };
    const response = await fetch('/api/games', {method:'POST',headers:{'Content-Type':'application/json','X-Beebo-Game':'1'},body:JSON.stringify(body),cache:'no-store',signal:AbortSignal.timeout(6000)});
    if (response.ok && !busy) { state = await response.json(); render(); }
  } catch(_) { /* the next poll will try again */ }
  resolving = false;
}
function form(parent, title, submit, label='Send', max=300, type='text') {
  const f=el('form'), l=el('label',title), input=el('input');
  input.name='entry';input.id='entry';input.type=type;input.maxLength=max;input.required=true;input.autocomplete='off';l.htmlFor=input.id;
  f.append(l,input,button(label,()=>{}));f.lastChild.type='submit';f.onsubmit=e=>{e.preventDefault();if(input.value.trim())submit(input.value);};parent.append(f);
}

// Sea Battle keeps only local selection/drag state here. The host owns each fleet.
const seaUI={key:'',selected:null,orientation:{},drag:null,notice:'',bad:false,ignoreClickUntil:0,shots:[],focus:''};
const SEA_NAMES=['Flagship','Cruiser','Submarine','Destroyer','Patrol boat'];
function seaKey(r){return [state.you,r?.game,r?.round,r?.watchMatch||'',state.tournament?.id||''].join(':');}
function seaEditable(r){return !!(r&&r.game==='seabattle'&&r.phase==='playing'&&r.stage==='placing'&&!r.myReady&&r.myShips?.length&&online&&!busy);}
function seaMessage(text,bad=false){seaUI.notice=text;seaUI.bad=bad;const n=app.querySelector('.sb-help');if(n){n.textContent=text;n.classList.toggle('invalid',bad);}}
function seaResetDrag(){const d=seaUI.drag;if(!d)return;seaUI.drag=null;try{if(d.source.hasPointerCapture(d.pointerId))d.source.releasePointerCapture(d.pointerId);}catch(_){}app.querySelector('.sb-preview')?.remove();app.querySelectorAll('.ghosted').forEach(n=>n.classList.remove('ghosted'));}
function seaHold(){
  if(!seaUI.drag)return false;
  if(seaKey(state.room)!==seaUI.key||!seaEditable(state.room)){seaResetDrag();return false;}
  return true; // Polls still update state, but cannot replace a captured drag element.
}
function seaCells(r,id,cell,vertical){
  const ship=r.myShips?.find(s=>s.id===id),w=r.width||8;
  if(!ship||!Number.isInteger(cell)||cell<0||cell>=w*w)return null;
  const row=Math.floor(cell/w),col=cell%w;
  if((vertical?row:col)+ship.size>w)return null;
  const cells=Array.from({length:ship.size},(_,i)=>cell+i*(vertical?w:1));
  const occupied=new Set(r.myShips.filter(s=>s.id!==id).flatMap(s=>s.cells||[]));
  return cells.some(c=>occupied.has(c))?null:cells;
}
function seaName(cell,w=8){return String.fromCharCode(65+cell%w)+(Math.floor(cell/w)+1);}
function seaPlace(id,cell,vertical){
  const r=state.room;
  if(!seaEditable(r))return;
  if(!seaCells(r,id,cell,vertical)){seaMessage('That position will not fit. Keep the ship inside the grid and clear of other ships.',true);return;}
  seaUI.selected=id;seaUI.orientation[id]=vertical;
  seaMessage(SEA_NAMES[id]+' placed at '+seaName(cell,r.width)+'.');
  return send('place',{ship:id,cell,vertical:vertical?1:0});
}
function seaPick(id){
  if(!seaEditable(state.room)||Date.now()<seaUI.ignoreClickUntil)return;
  seaUI.selected=id;const s=state.room.myShips.find(s=>s.id===id);
  if(s?.cells.length)seaUI.orientation[id]=!!s.vertical;
  seaMessage(SEA_NAMES[id]+': drag it, or tap an open starting square.');
  seaUI.focus='dock-'+id;render(true);
}
function seaRotate(){
  const r=state.room,id=seaUI.selected,s=r?.myShips?.find(s=>s.id===id);
  if(!s||!seaEditable(r))return;
  const vertical=!(seaUI.orientation[id]??s.vertical);
  if(s.cells.length){
    if(!seaCells(r,id,s.cells[0],vertical)){seaMessage('No room to rotate here. Move the ship into open water first.',true);return;}
    seaUI.focus='rotate';seaPlace(id,s.cells[0],vertical);
  }else{seaUI.orientation[id]=vertical;seaMessage(SEA_NAMES[id]+' is now '+(vertical?'vertical':'horizontal')+'. Tap its starting square or drag it onto your sea.');seaUI.focus='rotate';render(true);}
}
// Original code-native hulls stay crisp on any screen; all art is bundled offline.

  add('path',{d:hull,fill:ship.sunk?'#657582':'#a9c9d6',stroke:'#09283c','stroke-width':5});

  add('path',{d:`M 24 51 L ${length-23} 51 Q ${length-36} 68 ${length-66} 74 L 24 68 Z`,fill:'#557789',opacity:'.55'});
  if(ship.id===0){
    add('rect',{x:35,y:31,width:length-104,height:39,rx:5,fill:'#35576b',stroke:'#edf4df','stroke-width':2});
    add('path',{d:`M 43 50 H ${length-83}`,stroke:'#f3d77b','stroke-width':3,'stroke-dasharray':'13 10'});
    add('rect',{x:90,y:16,width:72,height:20,rx:5,fill:'#708b9e',stroke:'#deeced','stroke-width':2});
    add('path',{d:'M 125 35 L 135 46 L 151 50 L 135 53 L 125 63 L 127 52 L 116 50 L 127 47 Z',fill:'#edf6ed'});
  }else if(ship.id===2){

function artDiceResult(r,local=false){

function artDiceObserve(r){

// Cheap, honest "how long ago". Only ever fed a host clock reading.
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 90) return 'just now';
  const m = Math.round(s/60); if (m < 60) return m + ' min ago';

/**
 * THE CHART. One picture, and it exists to answer one real question.
 *
 * The table is ordered by a shrunk win rate, and a bare "58%" explains nothing - a
 * child who won their only game will ask why they are not top. So the thing worth
 * plotting is not wins over time (twelve saved matches is not a season, and a line
 * through it would be noise dressed as a trend); it is the SHRINK ITSELF. Each row
 * shows the raw win rate as a hollow ring, the rating it was pulled to as a filled
 * dot, and the gap between them as a line. The dashed spine is an even record.
 *
 * Read across one row and you see how much the host distrusted that record; read
 * down the rows and you see the rings scatter while the dots cluster. That is a true
 * thing about a family's weekend, and it is the justification for the ranking.
 */
function shrinkChart(rows) {
  const L = 104, R = 16, W = 360, H0 = 40, RH = 30, H = H0 + rows.length * RH + 34;
  const svg = svgel('svg', {viewBox:'0 0 ' + W + ' ' + H, class:'chart', role:'img'});
  svg.append(svgel('title', {}, 'Raw win rate compared with the settled rating, for each player.'));
  const x = p => L + (Math.max(0, Math.min(100, p)) / 100) * (W - L - R);
  [0,25,50,75,100].forEach(v=>{
    const even = v === 50;
    svg.append(svgel('line',{x1:x(v),y1:H0-10,x2:x(v),y2:H0+rows.length*RH-6,stroke:even?'#efcc69':'#3f5373','stroke-width':even?1.5:1,'stroke-dasharray':even?'5 4':'2 5','opacity':even?0.75:0.5}));
    svg.append(svgel('text',{x:x(v),y:H0-16,fill:'#b9c7dd','text-anchor':'middle'}, v + '%'));
  });
  rows.forEach((s,i)=>{
    const y = H0 + i * RH + 8;
    const short = s.name.length > 11 ? s.name.slice(0,10) + '…' : s.name;
    svg.append(svgel('text',{x:0,y:y+4,fill:'#f5f4ff','font-weight':'650'}, short));
    svg.append(svgel('text',{x:0,y:y+16,fill:'#b9c7dd','font-size':'10'}, s.played + (s.played===1?' game':' games') + (s.provisional?' · settling':'')));
    const a = x(s.winRate), b = x(s.rating);
    svg.append(svgel('line',{x1:a,y1:y,x2:b,y2:y,stroke:'#bc9cf8','stroke-width':2,'stroke-linecap':'round','opacity':0.65}));
    svg.append(svgel('circle',{cx:a,cy:y,r:5,fill:'none',stroke:'#bc9cf8','stroke-width':2}));
    svg.append(svgel('circle',{cx:b,cy:y,r:5.5,fill:'#efcc69'}));
  });
  const legendY = H0 + rows.length * RH + 16;
  svg.append(svgel('circle',{cx:8,cy:legendY-4,r:5,fill:'none',stroke:'#bc9cf8','stroke-width':2}));
  svg.append(svgel('text',{x:18,y:legendY,fill:'#b9c7dd'},'win rate'));
  svg.append(svgel('circle',{cx:104,cy:legendY-4,r:5.5,fill:'#efcc69'}));
  svg.append(svgel('text',{x:114,y:legendY,fill:'#b9c7dd'},'ranking'));
  svg.append(svgel('line',{x1:190,y1:legendY-10,x2:190,y2:legendY+2,stroke:'#efcc69','stroke-width':1.5,'stroke-dasharray':'5 4'}));
  svg.append(svgel('text',{x:198,y:legendY,fill:'#b9c7dd'},'even record'));
  return svg;
}

// ---- the bracket ---------------------------------------------------------
/**
 * A real knockout bracket: one column per round, the two players facing each other
 * in a cell, and the winner's line carrying on into the next column.
 *
 * ON A PHONE, WITH EIGHT PLAYERS. Eight players is four cells in the first column,
 * then two, then one. Four cells stacked at full width is readable; four columns
 * side by side on a 360px screen is not, so the rounds do not shrink to fit - the
 * rail scrolls sideways and each column is 84vw, which means one round fills the
 * screen and the next one peeks in at the edge to advertise the scroll. The rail
 * snaps, so a one-thumb flick lands on exactly one round rather than somewhere
 * between two. The chips above jump straight to a round for anybody who would
 * rather tap than swipe, and the screen parks itself on the round being played
 * (or on your own heat) whenever that changes - but never on every poll, or it
 * would fight the thumb of somebody looking at an earlier round.
 *
 * The rounds themselves are built by the host only as they are needed, so a bracket
 * that has not got to the final yet genuinely has no final column. That is drawn
 * honestly: the last decided winners end in a stub, not in an invented cell.
 */
function renderBracket(t, container) {
  const rounds = t.rounds || [];
  const head = el('div');
  head.append(el('h2', t.title + ' tournament'));
  const status = t.state === 'complete' ? 'Finished' : t.state === 'running' ? 'Round ' + (t.round + 1) + ' of ' + Math.max(t.roundCount, t.round + 1) : t.state === 'cancelled' ? 'Ended by the leader' : 'Abandoned';
  head.append(el('div', status + ' · ' + (t.players||[]).length + ' players', 'muted'));
  container.append(head);
  if (t.state === 'complete' && t.championName) {
    const c = el('div',null,'champ');
    c.append(el('div','CHAMPION','eyebrow'), el('strong', t.championName), el('div','Won ' + t.title + ' from ' + (t.players||[]).length + ' players.','muted'));
    container.append(c);
  }
  if (t.note) container.append(el('p', t.note, 'notice'));

  const rail = el('div',null,'rail');
  // The chips are the "collapse to the live round" answer: a round is one tap away
  // however far the rail has been scrolled.
  if (rounds.length > 1) {
    const chips = el('div',null,'chips');
    rounds.forEach((rd,i)=>{
      const b = button(rd.name, ()=>{ const col = rail.children[i + 1]; if (col) rail.scrollTo({left: col.offsetLeft, behavior:'smooth'}); focusedRound = i; });
      b.disabled = false;
      if (rd.state !== 'complete') b.classList.add('sel');
      chips.append(b);
    });
    container.append(chips);
  }

  const lines = svgel('svg', {class:'lines', 'aria-hidden':'true'});
  rail.append(lines);
  rounds.forEach((rd,i)=>{
    const col = el('div',null,'round');
    const rh = el('div',null,'rhead');
    rh.append(el('span', rd.name), el('em', rd.state === 'complete' ? 'done' : 'playing'));
    col.append(rh);
    (rd.matches||[]).forEach(m=>col.append(boutCell(m, t)));
    rail.append(col);
  });
  container.append(rail);

  // Park on the round that is actually happening. focusedRound remembers where we
  // last put them, so a guest reading round one is left alone until it changes.
  let target = -1;
  rounds.forEach((rd,i)=>{ if (rd.state !== 'complete') target = target < 0 ? i : target; });
  if (t.yourMatch) rounds.forEach((rd,i)=>{ if ((rd.matches||[]).some(m=>m.id === t.yourMatch)) target = i; });
  if (target < 0) target = rounds.length - 1;
  if (target !== focusedRound && target >= 0) {
    focusedRound = target;
    requestAnimationFrame(()=>{ const col = rail.children[target + 1]; if (col) rail.scrollTo({left: col.offsetLeft, behavior:'auto'}); });
  } else if (railLeft != null) {
    // Same round as last time: put the guest back exactly where their thumb left it.
    requestAnimationFrame(()=>{ rail.scrollLeft = railLeft; });
  }
  lastRail = { rail, lines, rounds, t };
  // Measure once layout has settled, then draw the elbows into the overlay.
  requestAnimationFrame(()=>drawLines(rail, lines, rounds, t));
}

function boutCell(m, t) {
  const cell = el('div',null,'bout');
  cell.dataset.bout = m.id;
  if (m.yours) cell.classList.add('mine');
  if (m.state === 'bye') cell.classList.add('bye');
  const people = m.players || [];
  people.forEach((p,i)=>{
    if (i) cell.append(el('div','VS','vs'));
    const side = el('div',null,'side');
    if (m.winnerId && p.id === m.winnerId) side.classList.add('through');
    else if (m.winnerId) side.classList.add('outp');
    const dot = el('span',null,'dot'); if (p.online) dot.classList.add('on');
    side.append(dot, el('span', p.name, 'nm'));
    if (p.through) side.append(el('span','▲ through','sc'));
    else if (m.state !== 'bye') side.append(el('span', String(p.score), 'sc'));
    cell.append(side);
  });
  // A bye is an ordinary cell with one player in it. Saying so plainly is better
  // than drawing an empty seat opposite them.
  if (m.state === 'bye') cell.append(el('div','Bye — straight through, nobody to play.','ln'));
  else {
    const bits = [];
    if (m.line) bits.push(m.line);
    if (m.state === 'playing' && (m.waitingOn||[]).length) bits.push('waiting on ' + m.waitingOn.join(', '));
    if (m.state === 'void') bits.push('No result — nobody was left to finish it.');
    if (m.note) bits.push(m.note);
    if (m.decidedBy === 'countback') bits.push('Decided on countback.');
    if (bits.length) cell.append(el('div', bits.join(' · '), 'ln'));
  }
  if (m.yours) cell.append(el('div','This is your heat.','ln'));
  else if (m.state === 'playing' && t.state === 'running' && !t.yourMatch) {
    // The engine has always been able to point a spectator at one heat; nothing
    // used it. Watching also stands you down from the next round, so say so.
    const watching = state.room && state.room.watchMatch === m.id;
    cell.append(button(watching ? 'Watching this heat' : 'Watch this heat', ()=>send('watch',{match:m.id}), watching, 'bt'));
  }
  return cell;
}

/**
 * Draw the line a winner travels along.
 *
 * The host SHUFFLES the winners before it makes the next round, so a cell's slot
 * number says nothing about where its winner went. The only honest way to join two
 * cells is by the player: find the cell in the next round that actually contains
 * this cell's winner. That is exact, and it needs no special case for a bye or for
 * a round with an odd number of heats in it.
 */
function drawLines(rail, svg, rounds, t) {
  if (!rail.isConnected) return;
  const w = rail.scrollWidth, h = rail.scrollHeight;
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  svg.replaceChildren();
  const box = id => {
    const node = rail.querySelector('[data-bout="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
    if (!node) return null;
    const col = node.parentElement;
    return { x: col.offsetLeft + node.offsetLeft, y: col.offsetTop + node.offsetTop, w: node.offsetWidth, h: node.offsetHeight };
  };
  rounds.forEach((rd,i)=>{
    (rd.matches||[]).forEach(m=>{
      if (!m.winnerId) return;
      const from = box(m.id); if (!from) return;
      const next = rounds[i+1];
      const heir = next && (next.matches||[]).find(n=>(n.players||[]).some(p=>p.id === m.winnerId));
      const mine = m.yours || (heir && heir.yours);
      const colour = mine ? '#bc9cf8' : '#8adab0';
      const x1 = from.x + from.w, y1 = from.y + from.h / 2;
      if (!heir) {
        // Nowhere to go yet - the next round has not been drawn. A stub is the
        // truthful drawing; an empty cell would be a promise the host has not made.
        svg.append(svgel('path',{d:'M ' + x1 + ' ' + y1 + ' h 9', stroke:colour,'stroke-width':2.5,fill:'none','stroke-linecap':'round','opacity':0.8}));
        svg.append(svgel('circle',{cx:x1+13,cy:y1,r:3.5,fill:colour,opacity:0.8}));
        return;
      }
      const to = box(heir.id); if (!to) return;
      const x2 = to.x, y2 = to.y + to.h / 2, mid = x1 + Math.max(8, (x2 - x1) / 2);
      svg.append(svgel('path',{d:'M ' + x1 + ' ' + y1 + ' H ' + mid + ' V ' + y2 + ' H ' + x2, stroke:colour,'stroke-width':2.5,fill:'none','stroke-linejoin':'round','stroke-linecap':'round','opacity':mine?0.95:0.7}));
    });
  });
}

// ---- the room ------------------------------------------------------------
const TURN_GAMES = ['connect4','ttt','checkers','reversi','morris','dominoes','gofish','crazy8s','oldmaid','snap','storybuilder','categorychains','snakesladders','ludo','pairs','dotsboxes','mancala','fivedice','chess'];

function render(force=false) {
  if(!state)return;
  // A party game's countdown moves every poll; the page ticks it locally instead of
  // rebuilding the screen (and a half-typed answer) once a second.
  const r=state.room, fingerprint=JSON.stringify(state,(k,v)=>k==='remainingMs'?undefined:v);
  artDiceObserve(r);
  if(seaHold() || PARTY_HOLD()) return;
  if(!force && fingerprint===rendering)return;
  rendering=fingerprint;
  const oldInput=document.getElementById('entry'), draft=oldInput?.value, focused=document.activeElement===oldInput, cursor=oldInput?.selectionStart;
  const oldRail=app.querySelector('.rail'); railLeft = oldRail ? oldRail.scrollLeft : null; lastRail = null;
  if(r?.game==='seabattle')seaUI.focus=document.activeElement?.dataset?.seaFocus||'';
  document.querySelector('main').dataset.artGame=r?.game||'menu';
  app.replaceChildren();
  requestAnimationFrame(()=>{if(state?.room===r)artAfterRender(r);});
  if(!r){ sel=null; focusedRound=-1; rulesOpen=false; renderMenu(); return; }
  // A selection is only ever valid for the exact round it was made in. Coming back
  // from a sleeping phone, or a heat moving on underneath us, throws it away.
  if (sel && (sel.game !== r.game || sel.round !== r.round || sel.phase !== r.phase)) sel = null;
  const owner=r.owner===state.you, playing=r.phase==='playing', finished=r.phase==='done', seated=r.players.filter(p=>!p.watching).length;
  const t = state.tournament, live = !!(t && t.state === 'running');
  app.append(button('← All games',()=>send('leave')),el('div','PLAYING AS '+state.name,'eyebrow'),el('h1',r.title));
  const artwork=artGameBanner(r.game);if(artwork)app.append(artwork);
  const roster=el('div',null,'roster');r.players.forEach(p=>roster.append(el('span',p.name+(p.id===state.you?' · You':'')+(p.bot?' · Bot':'')+(p.id===r.owner?' · Leader':'')+(p.watching?' · Watching':'')+(!p.online?' · Reconnecting…':''), 'player'+(p.id===state.you?' me':'')+(playing && p.id===r.turn && TURN_GAMES.includes(r.game)?' turn':''))));app.append(roster);
  howToPlay(r.game);
  partyNarrate(r, owner);

  if (live) {
    if (r.phase === 'waiting') {
      // Knocked out, sitting one out, or watching on purpose. The bracket is the
      // whole screen for them, so it goes first and nothing pretends to need them.
      app.append(el('p', t.yourMatch ? 'Your heat is being set up.' : 'You are not in a heat right now. Follow the bracket, or tap a heat to watch it.','notice'));
      renderBracket(t, app);
    } else {
      if (t.yourTurn) app.append(el('p','Your heat is waiting for you.','notice'));
      renderMatch(r, false);
      app.append(el('div','THE BRACKET','eyebrow'));
      renderBracket(t, app);
    }
    if (r.spectating) app.append(button('Stop watching · put me in the next round',()=>send('unwatch')));
    if (owner) app.append(button('End the tournament',()=>send('cancel')));
    restoreDraft(draft, focused, cursor); return;
  }

  if(r.phase==='lobby'){
    if(PACK_A.lobby[r.game]){PACK_A.lobby[r.game](r,owner,seated);restoreDraft(draft, focused, cursor);return;}
    app.append(el('p',r.blurb||labels[r.game],'muted'),el('p',seated<2?'Waiting for another player. Add a bot if nobody else is around.':'Ready when the leader starts.','notice'));
    if(['connect4','ttt','checkers','reversi','morris','mancala','chess'].includes(r.game))app.append(el('p','The first two players take the seats. Others can watch and join after a seat is free.','muted'));
    if(owner){const crew=el('div',null,'actions');crew.append(button('Add a bot',()=>send('addbot'),r.players.length>=12));if(state.local)crew.append(button('Add a player on this phone',()=>send('addlocal'),r.players.length>=12));if(r.bots>0)crew.append(button('Remove a bot',()=>send('removebot')));app.append(crew);}
    app.append(button(r.spectating?'I want to play the next round':'Watch instead of playing',()=>send(r.spectating?'unwatch':'watch')));
    if(PARTY_SETTINGS[r.game]) partyLobby(r, owner, seated);
    if(owner){
      if(CAMPFIRE.includes(r.game))campfireLobby(r,seated);
      else if(PARTY_SETTINGS[r.game]) app.append(button('Start round',()=>send('start',{text:partySetupText(r.game)}),seated<partyMin(r.game),'primary'));
      else if(r.game==='twentyquestions')form(app,'Choose a secret (only you can see it)',text=>send('start',{text}),'Start round',100,'password');
      else { if(TABLE_GAMES.includes(r.game))tableOptions(r); app.append(button('Start round',()=>send('start',{text:tableSetup(r.game)}),seated<(r.game==='fivedice'?1:2),'primary')); }
      // The engine has had brackets all along and no button anywhere could start
      // one. Only games the host says are bracket-ready are ever offered.
      if(r.bracket){
        app.append(el('div','OR RUN A TOURNAMENT','eyebrow'));
        app.append(el('p','Everybody here is drawn into heats. The winners play the winners until one is left.','muted'));
        app.append(button('Start a tournament',()=>send('tournament'),seated<2,'primary'));
      }
    }
    else app.append(el('p',nameOf(r,r.owner)+' will start the round.'));
    if (t) { app.append(el('div','LAST TOURNAMENT','eyebrow')); renderBracket(t, app); }
    if ((r.standings||[]).length) { app.append(el('h3','Standings at ' + r.title)); app.append(standingsTable(r.standings, false)); }
    restoreDraft(draft, focused, cursor); return;
  }

  renderMatch(r, true);
  if (t) { app.append(el('div','LAST TOURNAMENT','eyebrow')); renderBracket(t, app); }
  restoreDraft(draft, focused, cursor);
}

function restoreDraft(draft, focused, cursor){
  const newInput=document.getElementById('entry');
  if(newInput&&draft!=null){newInput.value=draft;if(focused){newInput.focus({preventScroll:true});if(newInput.type!=='password'&&cursor!=null)newInput.setSelectionRange(cursor,cursor);}}
}

function howToPlay(gameId){
  const r = RULES[gameId]; if(!r) return;

  const ol = el("ol"); (r.steps||[]).forEach(t=>ol.append(el("li",t))); box.append(ol);
  if(r.note) box.append(el("p",r.note,"tip"));
