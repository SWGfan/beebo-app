# Secret scan: gitleaks on the commits a pull request or push to main adds, using the repo's
# .gitleaks.toml (default ruleset + narrow test-fixture allowances). Read-only token, no
# PR comments (so no write permission), no secrets needed.
#
# Licence: gitleaks-action is free for repos owned by a PERSONAL account. If the repo lives in
# a GitHub organization it needs a GITLEAKS_LICENSE secret, or swap this job for a pinned,
# checksum-verified download of the MIT-licensed gitleaks binary.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needed by the action to list the commits of a pull request. Read only.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scan walks the commit range, so it needs history
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false" # commenting needs pull-requests: write
          GITLEAKS_ENABLE_SUMMARY: "true"
