    const auto=button(cbLocal.auto?'Auto-daub: on':'Auto-daub: off',()=>{cbLocal.auto=!cbLocal.auto;render(true);}); auto.disabled=false; opts.append(auto);
    if(!caller){const v=button(cbLocal.guestVoice?'Voice: on':'Voice: off',()=>{cbLocal.guestVoice=!cbLocal.guestVoice;render(true);}); v.disabled=false; opts.append(v);}
    app.append(opts);
    if(playing){const wait=r.penaltyLeft||0;const b=button(wait?'BINGO! (wait '+wait+' calls)':'BINGO!',()=>send('bingo'),wait>0||!called.size||(r.winners||[]).includes(state.you),'primary');b.style.width='100%';b.style.minHeight='72px';b.style.fontSize='26px';app.append(b);}
    r.cards.forEach((card,ci)=>{
      app.append(el('h3','Card '+(ci+1)));
      const grid=el('div',null,'bingo'); const marks=new Set((r.cardMarks||[])[ci]||[]);
      'BINGO'.split('').forEach(L=>{const h=el('div',L);h.style.textAlign='center';h.style.fontWeight='850';grid.append(h);});
      card.forEach((n,i)=>{
        const free=i===12, daubed=free||marks.has(i)||(cbLocal.auto&&called.has(n));
        const b=button(free?'★':String(n),()=>send('mark',{card:ci,cell:i}),!playing||free,daubed?'marked':'');
        b.style.fontSize='20px'; b.setAttribute('aria-label',free?'Free square':cbLabel(n)+(daubed?', daubed':'')); grid.append(b);
      });
      app.append(grid);
    });
  } else app.append(el('p','You are the caller for this game.','notice'));
  const board=el('div',null,'panel'); board.append(el('strong','Called numbers'));
  'BINGO'.split('').forEach((L,col)=>{const line=el('div',null);line.style.display='flex';line.style.flexWrap='wrap';line.style.gap='3px';line.style.margin='4px 0';line.append(el('b',L+' '));
    for(let n=col*15+1;n<=col*15+15;n++){const d=el('span',String(n));d.style.cssText='min-width:26px;text-align:center;border-radius:99px;font-size:13px;padding:2px;'+(called.has(n)?'background:var(--gold);color:#161725;font-weight:750':'color:var(--muted)');line.append(d);}
    board.append(line);});
  app.append(board);
}

function drawNatureBingo(r, c){
  const { name, owner, active, playing } = c;
  const key=r.round+'';
  if(nbKey!==key){ Object.keys(nbPhotos).forEach(k=>{try{URL.revokeObjectURL(nbPhotos[k]);}catch(_){} delete nbPhotos[k];}); nbKey=key; nbCell=-1; }
  if(!nbInput){
    // One input for the whole page: the app redraws often, and a camera round-trip must land somewhere that still exists.
    nbInput=document.createElement('input'); nbInput.type='file'; nbInput.accept='image/*'; nbInput.setAttribute('capture','environment'); nbInput.hidden=true;
    nbInput.onchange=()=>{const f=nbInput.files&&nbInput.files[0]; if(f&&nbCell>=0){const k=nbKey+':'+nbCell; if(nbPhotos[k])URL.revokeObjectURL(nbPhotos[k]); nbPhotos[k]=URL.createObjectURL(f);} nbInput.value=''; render(true);};
    document.body.append(nbInput);
  }
  app.append(el('p','Packs: '+(r.packs||[]).join(', ')+'. Tap what you really spot.','muted'));
  app.append(el('p','Look, don’t touch wildlife. Don’t wander off alone at night.','notice'));
  const grid=el('div',null,'bingo');
  (r.bingo||[]).forEach((label,i)=>{
    const marked=(r.marks||[]).includes(i), photo=nbPhotos[nbKey+':'+i];
    const b=button(i===12?'★ FREE':label,()=>{nbCell=i;send('claim',{cell:i});},!playing||!active||i===12,(marked?'marked':'')+(nbCell===i?' chosen':''));
    b.setAttribute('aria-pressed',marked?'true':'false');
    if(photo){b.style.backgroundImage='linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url('+photo+')';b.style.backgroundSize='cover';b.style.color='#fff';}
    grid.append(b);
  });
  app.append(grid);
  if(active&&playing&&nbCell>=0&&nbCell!==12&&r.bingo){
    const row=el('div',null,'actions');
    row.append(el('span','Selected: '+r.bingo[nbCell]));
    row.append(button(nbPhotos[nbKey+':'+nbCell]?'Retake photo proof':'Add photo proof',()=>nbInput.click()));
    app.append(row);
    app.append(el('p','Photos stay on this phone only. Nothing is uploaded.','muted'));
  }
  const claims=r.claims||[], mine=claims.some(x=>x.id===state.you);
  if(active&&playing&&r.hasLine&&!mine)app.append(button('Call Bingo!',()=>send('bingo'),false,'primary'));
  if(mine&&playing)app.append(el('p','You called Bingo! Show your screen to the host while they check.','notice'));
  claims.forEach(cl=>{
    const box=el('div',null,'panel');
    box.append(el('strong',name(cl.id)+' called Bingo'), el('p','Line: '+(cl.line||[]).join(' · ')));
    if(owner&&playing){const row=el('div',null,'actions');row.append(button('Confirm Bingo',()=>send('verify',{target:cl.id}),false,'primary'),button('Not yet',()=>send('reject',{target:cl.id})));box.append(row);}
    app.append(box);
  });
}

function drawStories(r, c){
  const { name, owner, active, playing } = c;
  app.append(el('p','Tone: '+(r.mood||''),'muted'));
  if(playing&&active&&r.turn===state.you)form(app,'Add the next sentence',text=>send('text',{text}),'Add',300);
  else if(playing)app.append(el('p',name(r.turn)+' is adding the next sentence.','notice'));
  if(owner&&active&&playing&&!r.log.length)app.append(button('Different first line',()=>send('starter')));
  if(owner&&active&&playing)app.append(button('Finish the story',()=>send('finish'),!r.log.length));
  if('speechSynthesis' in window){
    const whole=[r.prompt].concat(r.log.map(l=>l.replace(/^[^:]*: /,''))).join(' ');
    const row=el('div',null,'actions');
    const read=button('Read aloud',()=>{try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(whole));}catch(_){}}); read.disabled=false;
    const stop=button('Stop',()=>{try{speechSynthesis.cancel();}catch(_){}}); stop.disabled=false;
    row.append(read,stop); app.append(row);
  }
}

function drawHotPotato(r, c){
  const { name, owner, active, playing, finished } = c;
  if(r.stage==='bang'||finished){
    const key=r.round+':'+r.burned;
    if(r.burned&&hpBurned!==key){hpBurned=key;try{if(navigator.vibrate)navigator.vibrate([300,100,300]);}catch(_){}}
    if(r.burned)app.append(el('div','💥 It went off! '+name(r.burned)+' was holding it.','result'));
  }
  if(playing){
    app.append(el('p','Say something in this category out loud, then pass.','muted'));
    if(r.myTurn){
      app.append(el('p','You’re holding the potato!','notice'));
      const b=button('Said it — pass!',()=>send('pass'),false,'primary'); b.style.width='100%'; b.style.minHeight='96px'; b.style.fontSize='22px'; app.append(b);
    } else app.append(el('p',name(r.holder)+' is holding the potato.','notice'));
  }
  const box=el('div',null,'panel'); box.append(el('strong','Letters'));
  (r.seats||[]).forEach(id=>{const got=(r.letters||{})[id]||''; box.append(el('div',name(id)+': '+(got?got.split('').join('-'):'–')));});
  app.append(box);
  if(owner&&active&&r.phase==='revealed')app.append(button('Next round',()=>send('next'),false,'primary'));
}

function drawTwoTruths(r, c){
  const { name, owner, active, playing, revealed } = c;
  const max=r.maxLength||100, key=r.game+':'+r.round;
  if(ttDraft.key!==key)ttDraft={key, s:['','',''], lie:-1, ideas:false};
  if(r.stage==='write'){
    app.append(el('p',r.written+' of '+r.seats.length+' players have written their statements.','muted'));
    if(active&&r.myStatements){
      const box=el('div',null,'panel'); box.append(el('strong','Your statements are in'));
      const ol=el('ol'); r.myStatements.forEach((t,i)=>ol.append(el('li',t+(i===r.myLie?'  (your lie)':'')))); box.append(ol);
      box.append(el('p','Only you can see which one is the lie. You can change them until voting starts.','muted'));
      app.append(box);
    }
    if(active){
      const focusId=document.activeElement&&document.activeElement.id, caret=document.activeElement&&document.activeElement.selectionStart;
      const f=el('form',null,'panel');
      f.append(el('strong',r.myStatements?'Change your statements':'Write two truths and one lie'));
      [0,1,2].forEach(i=>{
        const l=el('label','Statement '+(i+1)), input=el('input'); input.id='tt'+i; l.htmlFor=input.id;
        input.maxLength=max; input.autocomplete='off'; input.value=ttDraft.s[i];
        const count=el('div',ttDraft.s[i].length+' / '+max,'camp-count');
        input.oninput=()=>{ttDraft.s[i]=input.value;count.textContent=input.value.length+' / '+max;};
        const lie=el('label',null,'camp-lie'), radio=el('input'); radio.type='radio'; radio.name='ttlie'; radio.id='ttlie'+i; radio.checked=ttDraft.lie===i;
        radio.onchange=()=>{ttDraft.lie=i;}; lie.append(radio, el('span','This one is the lie'));
        f.append(l,input,count,lie);
      });
      const submit=button('Send my statements',()=>{},false,'primary'); submit.type='submit'; f.append(submit);
      f.onsubmit=e=>{e.preventDefault();
        if(ttDraft.s.some(t=>!t.trim())){error.replaceChildren(el('span','Fill in all three statements.'));error.hidden=false;return;}
        if(ttDraft.lie<0){error.replaceChildren(el('span','Mark which statement is the lie.'));error.hidden=false;return;}
        send('entry',{s0:ttDraft.s[0],s1:ttDraft.s[1],s2:ttDraft.s[2],lie:ttDraft.lie});};
      app.append(f);
      app.append(button(ttDraft.ideas?'Hide ideas':'Need ideas?',()=>{ttDraft.ideas=!ttDraft.ideas;render(true);}));
      if(ttDraft.ideas&&r.ideas){
        const box=el('div',null,'rules'); box.append(el('h4','Ideas to get you started'));
        const ul=el('ul',null,'camp-ideas'); r.ideas.forEach(t=>ul.append(el('li',t))); box.append(ul);
        box.append(button('Different ideas',()=>send('ideas'))); app.append(box);
      }
      if(focusId&&/^tt[0-2]$/.test(focusId)){const n=document.getElementById(focusId);if(n){n.focus({preventScroll:true});if(caret!=null)n.setSelectionRange(caret,caret);}}
    }
    if(owner&&active)app.append(button('Start voting now',()=>send('begin'),r.written<2));
    return;
  }
  // Voting, then the reveal.
  const me=r.spotlight===state.you;
  app.append(el('p','Spotlight '+r.spot+' of '+r.spots,'muted'));
  if(me&&!revealed)app.append(el('p','You’re in the spotlight. Keep a straight face while the others vote!','notice'));
  if(revealed&&r.correct!=null){
    const gained=r.gained||{}, lines=Object.keys(gained).filter(id=>gained[id]>0).map(id=>name(id)+' +'+gained[id]);
    const box=el('div',null,'result'); box.append(el('strong','The lie was: '+(r.options[r.correct]||'')));
    box.append(el('p',lines.length?lines.join(' · '):'No points this turn.'));
    if(!me&&active)box.append(el('p',r.myAnswer<0?'You didn’t vote.':r.myAnswer===r.correct?'You spotted it!':'You were fooled.'));
    app.append(box);
  }
  app.append(el('p',r.answered+' of '+r.expected+' voted'+(!revealed?' · The lie is revealed when everyone has voted.':''),'muted'));
  r.options.forEach((option,i)=>{
    const b=button('',()=>send('vote',{choice:i}),!playing||!active||me,'answer'+(r.myAnswer===i?' chosen':'')+(revealed&&r.correct===i?' wrong':'')+(revealed&&r.correct!==i?' correct':''));
    b.append(el('span',option));
    if(revealed)b.append(el('small',(r.correct===i?'✗ The lie · ':'✓ True · ')+(r.counts?.[i]??0)+((r.counts?.[i]??0)===1?' vote':' votes')));
    app.append(b);
  });
  if(owner&&active&&playing)app.append(button('Reveal now',()=>send('reveal')));
  if(owner&&active&&r.phase==='revealed')app.append(button(r.spot<r.spots?'Next spotlight':'See final scores',()=>send('next'),false,'primary'));
}
// ==== end of Campfire activities ===========================================

// How soon to ask the host again. Snap's judging window is closed by the next poll to
// reach the host (see nudge()), so a round that is in play keeps the 900 ms cadence,
// and so does a running tournament. The menu, a lobby and a finished round - where
// a guest phone spends most of the evening - can wait 1500 ms, which is a third
// fewer connections for the host phone to serve on battery. Hidden stays at 3 s.
function pollDelay(){
  if(document.hidden)return 3000;
  const r=state&&state.room, t=state&&state.tournament;
  const live=!!(r&&r.phase==='playing')||!!(t&&t.state==='running');
  return live?900:1500;
}
async function poll(){
  if(polling)return;
  if(busy){pollTimer=setTimeout(poll,900);return;}
  polling=true;const epoch=actionEpoch;
  try{const response=await fetch('/api/games',{cache:'no-store',signal:AbortSignal.timeout(7000)});if(response.status===401){location.href='/games';return;}if(!response.ok)throw Error();const next=await response.json();if(epoch===actionEpoch&&!busy){state=next;online=true;connection.textContent='Connected to your host · '+state.name;render();}}
  catch(_){online=false;connection.textContent='Reconnecting… Keep the host’s Wi-Fi selected. Your game is held for 90 seconds.';render(true);}
  polling=false;
  // Snap's judging window is closed by the next move to reach the host, and this
  // is that move. See nudge(): it is deliberately outside the busy/error path.
  if(state?.room?.game==='snap'&&state.room.judging)nudge('resolve');
  // Hot Potato's fuse is on the host clock; the holder (and now and then anyone) reminds the host to look at it.
  else if(state?.room?.game==='hotpotato'&&state.room.phase==='playing'&&(state.room.holder===state.you||Math.random()<0.25))nudge('tick');
  clearTimeout(pollTimer);pollTimer=setTimeout(poll,pollDelay());
}
// A phone that has been asleep resyncs from the snapshot rather than from anything
// it was holding: poll() replaces the whole state and render() redraws from it.
document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearTimeout(pollTimer);poll();}});
// The bracket's elbows are measured from real layout, so they have to be redrawn
// when the layout changes under them.
addEventListener('resize',()=>{if(lastRail&&lastRail.rail.isConnected)drawLines(lastRail.rail,lastRail.lines,lastRail.rounds,lastRail.t);});
/*@PAGE_PACKS@*/
poll();
})();
