# Keeps the CI configuration itself honest. Runs only when something under .github/ changes.
#  1. every third-party action is pinned to a full commit SHA that really is the commit of
#     the "# vX.Y.Z" tag written next to it (.github/scripts/verify-action-pins.py);
#  2. actionlint (workflow syntax, expression and shell mistakes), a checksum-verified
#     download of the official release binary.
# Read-only token, no secrets.
name: Workflow lint

on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's checksums file
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  lint:
    name: Pins and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actions are pinned to real commit SHAs
        run: python3 .github/scripts/verify-action-pins.py
      - name: Install actionlint (checksum verified)
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: >-
          "$RUNNER_TEMP/actionlint" -color
          -ignore 'shellcheck reported issue in this script: SC2(034|012|086|129):'
